<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bar-grad-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="bar-grad-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="bar-shadow">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
    <filter id="accent-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#fbbf24" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="48" height="48" rx="12" fill="url(#bg-grad)"/>
  <!-- Subtle inner highlight -->
  <rect x="1" y="1" width="46" height="46" rx="11" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <!-- Gantt bars -->
  <g filter="url(#bar-shadow)">
    <!-- Top bar - longest -->
    <rect x="9" y="10" width="30" height="5" rx="2.5" fill="url(#bar-grad-1)"/>
    <!-- Middle bar - shortest -->
    <rect x="9" y="18.5" width="17" height="5" rx="2.5" fill="url(#bar-grad-2)"/>
    <!-- Bottom bar - medium -->
    <rect x="9" y="27" width="24" height="5" rx="2.5" fill="url(#bar-grad-1)"/>
  </g>
  <!-- Accent diamond - premium touch -->
  <g filter="url(#accent-glow)">
    <rect x="29" y="17.5" width="5.5" height="5.5" rx="1.2" fill="url(#accent-grad)" transform="rotate(45 31.75 20.25)"/>
  </g>
  <!-- Timeline dots -->
  <circle cx="9" cy="36" r="1.5" fill="#a5b4fc" opacity="0.6"/>
  <circle cx="15" cy="36" r="1.5" fill="#a5b4fc" opacity="0.4"/>
  <circle cx="21" cy="36" r="1.5" fill="#a5b4fc" opacity="0.3"/>
</svg>
